name: Verify (types and tests)

# Verification only — this workflow never publishes anything. Deploying is
# deploy-pages.yml's job, and the two are deliberately kept apart: a type error
# should not block shipping otherwise-fine slide content, and that workflow's
# `concurrency: cancel-in-progress` group would cancel these runs along with it.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One verification run per ref. A newer push supersedes an in-flight check of the
# same branch; the deploy workflow's "pages" group is separate and untouched.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Check-And-Test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Must come BEFORE setup-node: `cache: pnpm` below needs the pnpm binary to
      # already exist so it can resolve the store path. Version 9 matches
      # deploy-pages.yml and the lockfile (lockfileVersion 9.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Pinned to 22 to match the CodingBooth image, which is where these commands
      # are actually run day to day. Without this the runner's default Node drifts
      # independently of what anyone verifies locally.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsconfig.json extends ./.svelte-kit/tsconfig.json, which does not exist in a
      # fresh checkout — vitest dies on a confusing MODULE_NOT_FOUND without this.
      # `pnpm run check` syncs on its own, but the test step must not depend on the
      # check step having run first.
      - name: Sync SvelteKit generated types
        run: pnpm exec svelte-kit sync

      # Type-check first: a type error is cheaper to read than a test failure caused
      # by one.
      - name: Check types (svelte-check)
        run: pnpm run check

      - name: Run the test suite
        run: pnpm test
